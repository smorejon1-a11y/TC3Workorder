<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TC3 Church - Work Order System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #1a2332;
            --primary-color: #2c3e50;
            --accent-color: #0099cc;
            --accent-light: #33b3dd;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --border-color: #ecf0f1;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
            color: white;
            padding: 32px 24px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            margin-bottom: 12px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-logo {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-menu {
            list-style: none;
            margin-bottom: 32px;
        }

        .sidebar-menu li {
            margin-bottom: 8px;
        }

        .sidebar-menu a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: var(--accent-color);
            color: white;
            transform: translateX(4px);
        }

        .sidebar-menu i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .user-section {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: white;
        }

        .user-details p {
            margin: 0;
            font-size: 13px;
        }

        .user-details .name {
            font-weight: 600;
            margin-bottom: 2px;
            color: white;
        }

        .user-details .role {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 32px;
        }

        .header {
            background: white;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 28px;
            margin-bottom: 24px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--primary-dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 153, 204, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            box-shadow: var(--shadow);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--accent-color);
            max-width: 350px;
        }

        .notification.success {
            border-left-color: var(--success-color);
        }

        .notification.error {
            border-left-color: var(--danger-color);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--accent-color);
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .work-orders-list {
            display: grid;
            gap: 16px;
        }

        .work-order-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            border-left: 4px solid var(--accent-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .work-order-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .work-order-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary-dark);
        }

        .work-order-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: var(--text-light);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            background: #ecf0f1;
            color: #3498db;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 12px;
            }

            .sidebar-logo {
                font-size: 14px;
            }

            .sidebar-menu a span {
                display: none;
            }

            .main-content {
                margin-left: 70px;
                padding: 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .text-muted {
            color: var(--text-light);
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">TC3</div>
                <div class="sidebar-subtitle">Facilities</div>
            </div>

            <ul class="sidebar-menu">
                <li><a class="nav-link active" onclick="switchSection('dashboard')">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a></li>
                <li><a class="nav-link" onclick="switchSection('submit')">
                    <i class="fas fa-plus-circle"></i>
                    <span>Submit Order</span>
                </a></li>
                <li><a class="nav-link" onclick="switchSection('my-orders')">
                    <i class="fas fa-list"></i>
                    <span>My Orders</span>
                </a></li>
            </ul>

            <div class="user-section">
                <div class="user-info">
                    <div class="user-avatar" id="userInitials">JD</div>
                    <div class="user-details">
                        <p class="name" id="userName">John Doe</p>
                        <p class="role">Member</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Dashboard Section -->
            <section id="dashboard" class="section active">
                <div class="header">
                    <h1>Dashboard</h1>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statOpen">0</div>
                        <div class="stat-label">Open Orders</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statInProgress">0</div>
                        <div class="stat-label">In Progress</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statCompleted">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="margin-top: 0; margin-bottom: 20px; color: var(--primary-dark);">Recent Work Orders</h3>
                    <div class="work-orders-list" id="recentOrdersList">
                        <p class="text-muted">No work orders yet.</p>
                    </div>
                </div>
            </section>

            <!-- Submit Order Section -->
            <section id="submit" class="section">
                <div class="header">
                    <h1>Submit Work Order</h1>
                </div>

                <div class="card">
                    <form id="workOrderForm" onsubmit="submitWorkOrder(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="title">Title *</label>
                                <input type="text" id="title" name="title" required placeholder="e.g., Broken door handle">
                            </div>
                            <div class="form-group">
                                <label for="location">Location *</label>
                                <input type="text" id="location" name="location" required placeholder="e.g., Main Hall">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="category">Category *</label>
                                <select id="category" name="category" required>
                                    <option value="">Select category</option>
                                    <option value="Plumbing">Plumbing</option>
                                    <option value="Electrical">Electrical</option>
                                    <option value="HVAC">HVAC</option>
                                    <option value="Carpentry">Carpentry</option>
                                    <option value="Cleaning">Cleaning</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="priority">Priority *</label>
                                <select id="priority" name="priority" required>
                                    <option value="">Select priority</option>
                                    <option value="Low">Low</option>
                                    <option value="Medium">Medium</option>
                                    <option value="High">High</option>
                                    <option value="Critical">Critical</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group form-row full">
                            <label for="description">Description *</label>
                            <textarea id="description" name="description" required placeholder="Describe the issue..."></textarea>
                        </div>

                        <div class="form-group form-row full">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> Submit Work Order
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- My Orders Section -->
            <section id="my-orders" class="section">
                <div class="header">
                    <h1>My Work Orders</h1>
                </div>

                <div class="card">
                    <div class="work-orders-list" id="myOrdersList">
                        <p class="text-muted">No work orders submitted yet.</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/tc3.church/s/AKfycbxJC_aSnYT2Qj7GRuffoQt0wx5Ryd9_GL6-Wqu4GYIXNGA2Jh6wiBQKPTX7r6ZeVvDnPg/exec';

        let currentUser = {
            name: 'John Doe',
            email: 'john@tc3.church',
            role: 'member'
        };

        let workOrders = [];

        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');

            document.querySelectorAll('.nav-link').forEach(a => a.classList.remove('active'));
            event.target.closest('a').classList.add('active');

            if (sectionId === 'dashboard') {
                loadDashboard();
            } else if (sectionId === 'my-orders') {
                loadMyOrders();
            }
        }

        function submitWorkOrder(event) {
            event.preventDefault();

            const payload = {
                action: 'submitWorkOrder',
                title: document.getElementById('title').value,
                location: document.getElementById('location').value,
                category: document.getElementById('category').value,
                priority: document.getElementById('priority').value,
                description: document.getElementById('description').value,
                estimatedCost: 0,
                submittedBy: currentUser.name,
                submitterEmail: currentUser.email
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response:', data);
                if (data.success) {
                    showNotification('success', 'Work order submitted successfully!');
                    document.getElementById('workOrderForm').reset();
                    switchSection('my-orders');
                } else {
                    showNotification('error', 'Error: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('error', 'Error: ' + error.message);
            });
        }

        function loadDashboard() {
            const open = workOrders.filter(o => o.status === 'Open').length;
            const inProgress = workOrders.filter(o => o.status === 'In Progress').length;
            const completed = workOrders.filter(o => o.status === 'Completed').length;

            document.getElementById('statOpen').textContent = open;
            document.getElementById('statInProgress').textContent = inProgress;
            document.getElementById('statCompleted').textContent = completed;

            const html = workOrders.slice(0, 5).map(order => `
                <div class="work-order-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <div style="font-weight: 700; color: var(--accent-color);">${order.id}</div>
                        <span class="status-badge">${order.status}</span>
                    </div>
                    <div class="work-order-title">${order.title}</div>
                    <div class="work-order-meta">
                        <div><i class="fas fa-map-marker-alt"></i> ${order.location}</div>
                        <div><i class="fas fa-tag"></i> ${order.category}</div>
                        <div><i class="fas fa-calendar"></i> ${order.submittedDate}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('recentOrdersList').innerHTML = html || '<p class="text-muted">No work orders yet.</p>';
        }

        function loadMyOrders() {
            const myOrders = workOrders.filter(o => o.submittedBy === currentUser.name);
            const html = myOrders.map(order => `
                <div class="work-order-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <div style="font-weight: 700; color: var(--accent-color);">${order.id}</div>
                        <span class="status-badge">${order.status}</span>
                    </div>
                    <div class="work-order-title">${order.title}</div>
                    <div class="work-order-meta">
                        <div><i class="fas fa-map-marker-alt"></i> ${order.location}</div>
                        <div><i class="fas fa-tag"></i> ${order.category}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('myOrdersList').innerHTML = html || '<p class="text-muted">No work orders submitted yet.</p>';
        }

        function showNotification(type, message) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<strong>${message}</strong>`;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 4000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const initials = currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('userInitials').textContent = initials;
            document.getElementById('userName').textContent = currentUser.name;
            loadDashboard();
        });
    </script>
</body>
</html>
